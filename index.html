
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePilot AI | Your Story, Your Cinema</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#121622;--accent:#a78bfa;--text:#f5f5fa;--muted:#a4a8bb}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#242044 0%,#090b12 55%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 7%;border-bottom:1px solid #ffffff12}
.logo{font-size:22px;font-weight:800;letter-spacing:-1px}.logo span{color:var(--accent)}
.tag{color:#c4b5fd;border:1px solid #8b5cf655;padding:7px 12px;border-radius:30px;font-size:12px}
main{max-width:850px;margin:65px auto;padding:0 20px}
.hero{text-align:center;margin-bottom:35px}
.eyebrow{color:#c4b5fd;font-size:12px;letter-spacing:3px;font-weight:bold}
h1{font-size:clamp(36px,7vw,64px);line-height:1.08;letter-spacing:-2px;margin:18px 0}
h1 span{background:linear-gradient(90deg,#c4b5fd,#f0abfc);background-clip:text;color:transparent}
.hero p{color:var(--muted);line-height:1.7;max-width:560px;margin:0 auto}
.panel{background:#121622eF;border:1px solid #ffffff18;border-radius:22px;padding:26px;box-shadow:0 25px 80px #0005}
label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}
textarea,select{width:100%;background:#0b0e17;border:1px solid #ffffff20;color:white;border-radius:12px;padding:14px;font:inherit;outline:none}
textarea{min-height:145px;resize:vertical;line-height:1.6}
textarea:focus,select:focus{border-color:#a78bfa}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}
select{cursor:pointer}
button{width:100%;border:0;border-radius:12px;padding:16px;background:linear-gradient(90deg,#8b5cf6,#c084fc);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.1)}button:disabled{opacity:.6;cursor:wait}
#status{color:#c4b5fd;text-align:center;font-size:13px;margin-top:15px;white-space:pre-wrap}
#result{display:none;margin-top:24px;background:#0b0e17;border:1px solid #ffffff18;border-radius:14px;padding:22px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
#result h2{margin-top:0}
.actions{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.actions button{margin:0}
.copy{background:#29223f}
.download{background:linear-gradient(90deg,#0f766e,#14b8a6)}
@media(max-width:550px){.actions{grid-template-columns:1fr}}
footer{text-align:center;padding:35px 15px;color:#777d91;font-size:12px}
@media(max-width:550px){header{padding:18px 5%}main{margin:42px auto}.panel{padding:18px}.fields{grid-template-columns:1fr}h1{letter-spacing:-1px}}
</style>
</head>
<body>
<header>
  <div class="logo">🎬 CinePilot<span> AI</span></div>
  <div class="tag">AI FILM STUDIO</div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">YOUR IMAGINATION, DIRECTED</div>
    <h1>Turn Your Story Into<br><span>Cinema.</span></h1>
    <p>Bring your ideas to life. Create film concepts, characters, scenes and cinematic story blueprints with AI.</p>
  </section>

  <section class="panel">
    <label for="story">YOUR STORY IDEA</label>
    <textarea id="story" maxlength="5000" placeholder="A young filmmaker discovers a mysterious camera that shows the future..."></textarea>

    <div class="fields">
      <div>
        <label for="genre">FILM GENRE</label>
        <select id="genre">
          <option>Drama</option><option>Action</option><option>Science Fiction</option>
          <option>Thriller</option><option>Horror</option><option>Romance</option>
          <option>Comedy</option><option>Fantasy</option><option>Mystery</option>
        </select>
      </div>
      <div>
        <label for="mood">CINEMATIC MOOD</label>
        <select id="mood">
          <option>Cinematic</option><option>Dark and Intense</option>
          <option>Emotional</option><option>Dreamy</option>
          <option>Epic and Grand</option><option>Realistic</option>
          <option>Suspenseful</option>
        </select>
      </div>
    </div>

    <button id="generate" onclick="generateBlueprint()">✨ Generate Film Blueprint</button>
    <div id="status" role="status"></div>
    <div id="result"></div>
    <div id="actions" class="actions">
      <button id="copy" class="copy" onclick="copyBlueprint()">Copy Blueprint</button>
      <button id="download" class="download" onclick="downloadBlueprint()">Download Blueprint</button>
    </div>
  </section>
</main>

<footer>© 2026 CinePilot AI · Your story deserves the big screen.</footer>

<script>
const WORKER_URL = "https://cinepilot-ai-backend.mnhumnhuybjgffj.workers.dev";

async function generateBlueprint(){
  const story=document.getElementById("story").value.trim();
  const genre=document.getElementById("genre").value;
  const mood=document.getElementById("mood").value;
  const status=document.getElementById("status");
  const result=document.getElementById("result");
  const button=document.getElementById("generate");
  const actions=document.getElementById("actions");

  if(!story){
    status.textContent="Please enter your story idea first.";
    document.getElementById("story").focus();
    return;
  }

  if(WORKER_URL.includes("PASTE_YOUR")){
    status.textContent="Setup needed: add your Cloudflare Worker URL in the code first.";
    return;
  }

  button.disabled=true;
  button.textContent="Creating your film...";
  status.textContent="🎬 AI is building your cinematic blueprint...";
  result.style.display="none";
  copy.style.display="none";

  try{
    const response=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({story,genre,mood})
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||"AI request failed.");
    result.textContent=data.blueprint||"No blueprint received.";
    result.style.display="block";
    actions.style.display="grid";
    status.textContent="Your film blueprint is ready!";
  }catch(error){
    status.textContent="Error: "+error.message+
      "\nPlease check your Worker URL and Cloudflare settings.";
  }finally{
    button.disabled=false;
    button.textContent="✨ Generate Film Blueprint";
  }
}

async function copyBlueprint(){
  const text=document.getElementById("result").innerText.trim();
  const status=document.getElementById("status");

  if(!text){
    status.textContent="No blueprint available to copy yet.";
    return;
  }

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const temporary=document.createElement("textarea");
      temporary.value=text;
      temporary.setAttribute("readonly","");
      temporary.style.position="fixed";
      temporary.style.opacity="0";
      document.body.appendChild(temporary);
      temporary.select();
      temporary.setSelectionRange(0, temporary.value.length);
      const copied=document.execCommand("copy");
      temporary.remove();
      if(!copied) throw new Error("Clipboard copy was blocked.");
    }
    status.textContent="Blueprint copied successfully!";
  }catch(error){
    status.textContent="Copy was blocked by your browser. Select the blueprint text and press Ctrl+C.";
  }
}

function downloadBlueprint(){
  const text=document.getElementById("result").innerText.trim();
  const status=document.getElementById("status");

  if(!text){
    status.textContent="No blueprint available to download yet.";
    return;
  }

  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download="CinePilot-AI-Blueprint.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  status.textContent="Blueprint download started!";
}
</script>
</body>
</html>
